<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Metadata</title>
<style>
  :root {
    --updated-bg: #d9ead3; --updated-fg: #274e13;
    --partial-bg: #fff2cc; --partial-fg: #7f6000;
    --not-updated-bg: #f4cccc; --not-updated-fg: #990000;
    --failed-bg: #eeeeee; --failed-fg: #666666;
    --border: #dddddd; --muted: #666666; --link: #1155cc;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 24px; color: #1a1a1a; background: #fff;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 6px 0; }
  #breadcrumb { font-size: 0.95rem; margin-bottom: 4px; }
  #breadcrumb a { color: var(--link); text-decoration: none; }
  #breadcrumb a:hover { text-decoration: underline; }
  #lastUpdated { font-size: 0.85rem; color: var(--muted); }
  #status { font-size: 0.9rem; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 0.92rem; }
  caption { text-align: left; font-weight: 600; margin-bottom: 6px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  th { background: #fafafa; cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted::after { content: " " attr(data-dir); font-size: 0.75em; color: var(--muted); }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { filter: brightness(0.96); }
  td.num { text-align: right; }
  .status-Updated { background: var(--updated-bg); color: var(--updated-fg); }
  .status-NotUpdated { background: var(--not-updated-bg); color: var(--not-updated-fg); }
  .status-PartiallyUpdated { background: var(--partial-bg); color: var(--partial-fg); }
  .status-DownloadFailed, .status-ParseFailed { background: var(--failed-bg); color: var(--failed-fg); }
  .error-box {
    margin-top: 16px; padding: 12px 16px; background: var(--not-updated-bg);
    color: var(--not-updated-fg); border-radius: 6px; font-size: 0.95rem;
  }
  .stats-grid { display: flex; gap: 32px; flex-wrap: wrap; margin-top: 12px; }
  .stats-grid > div { min-width: 260px; }
  section.view { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Roster Metadata</h1>
  <div id="breadcrumb"></div>
  <div id="lastUpdated"></div>
</header>
<main id="app"><div id="status">Loading data.json…</div></main>

<script>
(function () {
  "use strict";

  var data = null;

  var CLASS_ORDER = ["Fr", "R-Fr", "So", "R-So", "Jr", "R-Jr", "Sr", "R-Sr", "Gr"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function displayCategory(cat) { return cat === "Gone" ? "Lost" : cat; }

  function findConference(name) {
    return data.conferences.find(function (c) { return c.name === name; });
  }
  function findSchool(conf, name) {
    return conf.schools.find(function (s) { return s.name === name; });
  }

  // ---- generic sortable table ----------------------------------------
  // columns: [{ label, key, num, render(row) }]
  function renderTable(container, columns, rows, opts) {
    opts = opts || {};
    var state = { key: opts.defaultKey || columns[0].key, dir: 1 };

    function draw() {
      var col = columns.find(function (c) { return c.key === state.key; });
      var sorted = rows.slice().sort(function (a, b) {
        var av = col.sortValue ? col.sortValue(a) : (col.render ? col.render(a) : a[col.key]);
        var bv = col.sortValue ? col.sortValue(b) : (col.render ? col.render(b) : b[col.key]);
        if (av < bv) return -1 * state.dir;
        if (av > bv) return 1 * state.dir;
        return 0;
      });

      var html = "<table>";
      if (opts.caption) html += "<caption>" + esc(opts.caption) + "</caption>";
      html += "<thead><tr>";
      columns.forEach(function (c) {
        var sortedCls = c.key === state.key ? " sorted" : "";
        var dir = c.key === state.key ? (state.dir === 1 ? "▲" : "▼") : "";
        html += '<th class="' + sortedCls + '" data-key="' + esc(c.key) + '" data-dir="' + dir + '">' + esc(c.label) + "</th>";
      });
      html += "</tr></thead><tbody>";
      sorted.forEach(function (row) {
        var rowCls = opts.rowClass ? opts.rowClass(row) : "";
        var clickable = opts.onRowClick ? " clickable" : "";
        html += '<tr class="' + esc(rowCls) + clickable + '" data-idx="' + rows.indexOf(row) + '">';
        columns.forEach(function (c) {
          var val = c.render ? c.render(row) : esc(row[c.key]);
          html += '<td class="' + (c.num ? "num" : "") + '">' + val + "</td>";
        });
        html += "</tr>";
      });
      html += "</tbody></table>";
      container.innerHTML = html;

      container.querySelectorAll("th").forEach(function (th) {
        th.addEventListener("click", function () {
          var key = th.getAttribute("data-key");
          if (state.key === key) state.dir *= -1; else { state.key = key; state.dir = 1; }
          draw();
        });
      });

      if (opts.onRowClick) {
        container.querySelectorAll("tbody tr").forEach(function (tr) {
          tr.addEventListener("click", function () {
            opts.onRowClick(rows[parseInt(tr.getAttribute("data-idx"), 10)]);
          });
        });
      }
    }

    draw();
  }

  // ---- views -----------------------------------------------------------
  function renderBreadcrumb(parts) {
    var bc = document.getElementById("breadcrumb");
    bc.innerHTML = parts.map(function (p, i) {
      if (i === parts.length - 1) return "<strong>" + esc(p.label) + "</strong>";
      return '<a href="' + p.href + '">' + esc(p.label) + "</a>";
    }).join(" / ");
  }

  function statusCounts(schools) {
    var counts = { Updated: 0, "Partially Updated": 0, "Not Updated": 0, "Download Failed": 0, "Parse Failed": 0 };
    schools.forEach(function (s) { counts[s.statusLabel] = (counts[s.statusLabel] || 0) + 1; });
    return counts;
  }

  function renderOverview() {
    renderBreadcrumb([{ label: "Overview" }]);
    var app = document.getElementById("app");
    app.innerHTML = '<section class="view"><div id="ov-table"></div></section>';

    var rows = data.conferences.map(function (c) {
      var counts = statusCounts(c.schools);
      return {
        name: c.name,
        updated: counts["Updated"],
        partial: counts["Partially Updated"],
        notUpdated: counts["Not Updated"],
        downloadFailed: counts["Download Failed"],
        parseFailed: counts["Parse Failed"],
        total: c.schools.length
      };
    });

    renderTable(document.getElementById("ov-table"), [
      { label: "Conference", key: "name" },
      { label: "Updated", key: "updated", num: true },
      { label: "Partially Updated", key: "partial", num: true },
      { label: "Not Updated", key: "notUpdated", num: true },
      { label: "Download Failed", key: "downloadFailed", num: true },
      { label: "Parse Failed", key: "parseFailed", num: true },
      { label: "Total Teams", key: "total", num: true }
    ], rows, {
      caption: "Click a conference to drill in",
      onRowClick: function (row) { location.hash = "#/c/" + encodeURIComponent(row.name); }
    });
  }

  function renderConference(confName) {
    var conf = findConference(confName);
    var app = document.getElementById("app");
    if (!conf) { app.innerHTML = '<div class="error-box">Unknown conference: ' + esc(confName) + "</div>"; return; }

    renderBreadcrumb([{ label: "Overview", href: "#/" }, { label: conf.name }]);
    app.innerHTML = '<section class="view"><div id="conf-table"></div></section>';

    renderTable(document.getElementById("conf-table"), [
      { label: "School", key: "name" },
      { label: "Status", key: "statusLabel" },
      { label: "Current", key: "currentCount", num: true },
      { label: "Previous", key: "previousCount", num: true },
      { label: "Returning", key: "returningCount", num: true },
      { label: "New", key: "newCount", num: true },
      { label: "Lost", key: "goneCount", num: true }
    ], conf.schools, {
      caption: "Click a school to see its roster",
      rowClass: function (s) { return "status-" + s.status; },
      onRowClick: function (s) { location.hash = "#/c/" + encodeURIComponent(conf.name) + "/s/" + encodeURIComponent(s.name); }
    });
  }

  function classOrderIndex(cls) {
    var i = CLASS_ORDER.findIndex(function (c) { return c.toLowerCase() === (cls || "").toLowerCase(); });
    return i === -1 ? CLASS_ORDER.length : i;
  }

  function renderClassStats(container, players) {
    var classes = {};
    players.forEach(function (p) {
      var cls = p.cls || "(unknown)";
      if (!classes[cls]) classes[cls] = { cls: cls, lost: 0, returning: 0, new: 0 };
      if (p.category === "Gone") classes[cls].lost++;
      else if (p.category === "Returning") classes[cls].returning++;
      else if (p.category === "New") classes[cls].new++;
    });

    var rows = Object.values(classes).sort(function (a, b) {
      return classOrderIndex(a.cls) - classOrderIndex(b.cls) || a.cls.localeCompare(b.cls);
    });

    var totals = rows.reduce(function (t, r) {
      t.lost += r.lost; t.returning += r.returning; t.new += r.new; return t;
    }, { lost: 0, returning: 0, new: 0 });

    var html = "<table><caption>Class breakdown</caption><thead><tr>" +
      "<th>Class</th><th>Lost</th><th>Returning</th><th>New</th></tr></thead><tbody>";
    rows.forEach(function (r) {
      html += "<tr><td>" + esc(r.cls) + '</td><td class="num">' + r.lost + '</td><td class="num">' + r.returning + '</td><td class="num">' + r.new + "</td></tr>";
    });
    html += '<tr><td><strong>Total</strong></td><td class="num"><strong>' + totals.lost +
      '</strong></td><td class="num"><strong>' + totals.returning + '</strong></td><td class="num"><strong>' + totals.new + "</strong></td></tr>";
    html += "</tbody></table>";
    html += '<p style="margin-top:8px;color:var(--muted)">Total roster size: <strong>' + (totals.returning + totals.new) + "</strong></p>";
    container.innerHTML = html;
  }

  function renderSchool(confName, schoolName) {
    var conf = findConference(confName);
    var school = conf && findSchool(conf, schoolName);
    var app = document.getElementById("app");
    if (!conf || !school) { app.innerHTML = '<div class="error-box">Unknown school: ' + esc(schoolName) + "</div>"; return; }

    renderBreadcrumb([
      { label: "Overview", href: "#/" },
      { label: conf.name, href: "#/c/" + encodeURIComponent(conf.name) },
      { label: school.name }
    ]);

    if (school.status === "DownloadFailed" || school.status === "ParseFailed") {
      app.innerHTML = '<div class="error-box"><strong>' + esc(school.statusLabel) + ":</strong> " + esc(school.errorMessage || "Unknown error") + "</div>";
      return;
    }

    app.innerHTML =
      '<section class="view">' +
      '<div class="stats-grid"><div id="school-stats"></div></div>' +
      '<div id="school-roster"></div>' +
      "</section>";

    renderClassStats(document.getElementById("school-stats"), school.players);

    renderTable(document.getElementById("school-roster"), [
      { label: "Name", key: "name" },
      { label: "Class", key: "cls" },
      { label: "Category", key: "category", render: function (p) { return esc(displayCategory(p.category)); } }
    ], school.players, { caption: "Roster (" + school.players.length + " players)" });
  }

  // ---- routing -----------------------------------------------------------
  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);

    if (parts.length === 0) { renderOverview(); return; }
    if (parts[0] === "c" && parts.length === 2) { renderConference(decodeURIComponent(parts[1])); return; }
    if (parts[0] === "c" && parts.length === 4 && parts[2] === "s") {
      renderSchool(decodeURIComponent(parts[1]), decodeURIComponent(parts[3]));
      return;
    }
    renderOverview();
  }

  window.addEventListener("hashchange", route);

  fetch("data.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (json) {
      data = json;
      document.getElementById("lastUpdated").textContent = "Last updated: " + data.lastUpdated;
      route();
    })
    .catch(function (err) {
      document.getElementById("app").innerHTML =
        '<div class="error-box">Could not load data.json: ' + esc(err.message) +
        "<br>If you're opening this file directly from disk, serve it over http:// instead (browsers block fetch() on file:// URLs) - e.g. run <code>python -m http.server</code> inside docs/.</div>";
    });
})();
</script>
</body>
</html>
